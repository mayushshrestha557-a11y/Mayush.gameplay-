<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>MAYUSH.GAMEPLAY</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="loading">
    MAYUSH.GAMEPLAY
    <p>Entering Nayabasti...</p>
  </div>

  <script type="module" src="game.js"></script>

  <style>
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #101820;
      color: white;
      font-size: 25px;
      z-index: 10;
      pointer-events: none;
    }

    #loading p {
      font-size: 14px;
      margin-top: 12px;
      color: #aaa;
    }
  </style>

  <script>
    window.addEventListener("load", () => {
      setTimeout(() => {
        document.getElementById("loading")?.remove();
      }, 2500);
    });
  </script>

</body>
</html>
