
<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#87ceeb">

  <title>MAYUSH.GAMEPLAY</title>

  <link rel="stylesheet" href="./style.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
      touch-action: none;
    }
  </style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
  

</head>

<body>
  <script>
window.addEventListener("error", function(e) {
  document.body.innerHTML =
    "<div style='background:#160000;color:white;padding:25px;font:14px Arial;overflow:auto;height:100vh'>" +
    "<h2>GAME ERROR</h2><pre>" +
    (e.message || "Unknown error") +
    "\n" + (e.filename || "") +
    "\nLine: " + (e.lineno || "") +
    "</pre></div>";
});

window.addEventListener("unhandledrejection", function(e) {
  document.body.innerHTML =
    "<div style='background:#160000;color:white;padding:25px;font:14px Arial'>" +
    "<h2>GAME LOADING ERROR</h2><pre>" +
    String(e.reason) +
    "</pre></div>";
});
</script>
  <script type="module" src="./game.js"></script>
</body>
</html>
