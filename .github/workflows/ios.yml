name: Build MAYUSH iOS Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build game files
        run: npm run build

      - name: Create iOS project
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

              - name: Lock iOS to Landscape
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          p = Path("ios/App/App/Info.plist")
          with p.open("rb") as f:
              data = plistlib.load(f)

          landscape = [
              "UIInterfaceOrientationLandscapeLeft",
              "UIInterfaceOrientationLandscapeRight"
          ]

          data["UISupportedInterfaceOrientations"] = landscape
          data["UISupportedInterfaceOrientations~ipad"] = landscape

          with p.open("wb") as f:
              plistlib.dump(data, f)
          PY

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: MAYUSH-iOS-Project
          path: ios/
